<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trekking Management Application | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1950&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        
        

        #form-body {
            min-height: 320px;
            width: 100%;
            max-width: 500px;
            background-color: rgba(240, 245, 241, 0.96); /* Light greenish-white glass background */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .text-green { color: #198754 !important; }
        .bg-green { background-color: #198754 !important; }
        
        .btn-green {
            background-color: #198754;
            color: white;
            font-weight: bold;
            border-radius: 30px;
            padding: 12px;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-green:hover {
            background-color: #146c43;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
        }

        .btn-outline-green {
            background-color: transparent;
            color: #198754;
            font-weight: bold;
            border-radius: 30px;
            padding: 12px;
            border: 2px solid #198754;
            transition: all 0.2s ease;
        }
        .btn-outline-green:hover {
            background-color: #198754;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }
    </style>
</head>
<body>

    <div id="form-body" class="animate__animated animate__fadeIn">
        <h2 class="mb-2 text-green fw-bold" style="letter-spacing: 0.5px;">TREK<span class="text-dark">PRO</span> PORTAL</h2>
        
        
        <div class="d-grid gap-3 mt-4">
            <a href="/login" class="btn btn-green btn-lg shadow-sm">Login</a>
            <a href="/register" class="btn btn-outline-green btn-lg">Register</a>
        </div>
        
    </div>

</body> 
</html>
