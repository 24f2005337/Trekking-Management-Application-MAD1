{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="card p-4 border-0 shadow-sm" style="border-radius: 20px; background: rgba(240, 245, 241, 0.95); width: 100%; max-width: 600px;">
        <h3 class="text-green fw-bold mb-3 text-center">Modify Trek Specifications</h3>
        <hr>
        <form action="/admin/edit_trek/{{ trek.id }}" method="POST">
            <div class="row g-3">
                <div class="col-md-12">
                    <label class="form-label small fw-bold">Trek Name</label>
                    <input type="text" class="form-control" name="name" value="{{ trek.name }}" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label small fw-bold">Location</label>
                    <input type="text" class="form-control" name="location" value="{{ trek.location }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Difficulty</label>
                    <select class="form-select form-control" name="difficulty">
                        <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                        <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                        <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Duration (Days)</label>
                    <input type="number" class="form-control" name="duration" value="{{ trek.duration }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold">Total Slots</label>
                    <input type="number" class="form-control" name="slots" value="{{ trek.available_slots }}" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label small fw-bold">Assign Trek Guide / Staff</label>
                    <select class="form-select form-control" name="staff_id">
                        <option value="">-- Keep Unassigned --</option>
                        {% for s in staff_profiles %}
                            <option value="{{ s.id }}" {% if trek.staff_id == s.id %}selected{% endif %}>
                                {{ s.user_identity.username }} (Contact: {{ s.contact_details if s.contact_details else 'N/A' }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-green w-100 rounded-pill fw-bold py-2 shadow-sm">Save Modifications</button>
                <a href="/admin/dashboard#treks-section" class="btn btn-secondary w-50 rounded-pill py-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
